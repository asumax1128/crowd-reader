<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>READ × CROWD</title>
<meta name="description" content="0〜100の数を全員で同時に出し、代表値に近い順に得点する読み合いゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Shippori+Mincho:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: 象牙色の紙に、金の細い罫と墨の文字。ロゴ「READ × CROWD」に合わせた古典的なローマン体と明朝体 */
:root{
  color-scheme:light;
  --sky-top:#fdfaf2; --sky:#efe5cf;
  --win-a:#fffdf8; --win-b:#f5ecda; --edge:#b48a3c; --line:rgba(80,58,20,.18);
  --text:#1e1a14; --dim:#6c6150; --gold:#9a7226; --you:#1b6784; --good:#2c7746; --bar:#c9b085; --bad:#b3261e;
  --f-title:"Cinzel","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-num:"Cinzel","Shippori Mincho",serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:radial-gradient(ellipse 120% 70% at 50% 0%,var(--sky-top),var(--sky) 75%) fixed;
  background-color:var(--sky);
  color:var(--text); font-family:var(--f-body); font-weight:500; font-size:15px; line-height:1.7;
  padding-inline:16px; padding-block:24px 48px;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
p{margin:0}
.dim{color:var(--dim)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* タイトル */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px 4px}
.logo img{display:block;width:min(92vw,470px);height:auto;filter:drop-shadow(0 4px 10px rgba(120,90,30,.18))}
.logo.sm img{width:min(70vw,300px)}
.logo h1{
  font-family:var(--f-title);font-weight:900;margin:0;text-align:center;line-height:1.1;
  font-size:clamp(2.1rem,10vw,3.2rem);letter-spacing:.08em;color:var(--text);
  background:linear-gradient(180deg,#5a4214 0%,#1e1a14 48%,#2b2318 70%,#8a6a2a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.logo .rule{width:min(260px,70%);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.logo .sub{font-family:var(--f-title);font-weight:600;color:var(--gold);letter-spacing:.35em;font-size:.78rem}
.logo .ja{color:var(--gold);font-weight:700;font-size:.9rem;letter-spacing:.3em}

/* コマンドウィンドウ */
.win{
  background:linear-gradient(180deg,var(--win-a),var(--win-b));
  border:1px solid var(--edge);border-radius:6px;
  box-shadow:inset 0 0 0 3px var(--win-a),inset 0 0 0 4px rgba(180,138,60,.35),0 6px 18px rgba(110,80,25,.12);
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;
}
.cap{font-family:var(--f-title);font-weight:800;font-size:.8rem;letter-spacing:.18em;color:var(--gold)}
h2{font-family:var(--f-title);font-weight:800;font-size:1.3rem;margin:0;text-wrap:balance}
.big-title{font-family:var(--f-title);font-weight:900;font-size:2.1rem;letter-spacing:.06em;margin:0;line-height:1.2}

.menu{display:flex;flex-direction:column;gap:2px}
.cmd{
  font:inherit;font-size:1.05rem;font-weight:700;color:var(--text);background:transparent;border:none;
  text-align:left;padding:10px 10px 10px 30px;position:relative;cursor:pointer;border-radius:4px;min-height:44px;
}
.cmd::before{content:"▶";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--gold);opacity:0}
.cmd:hover::before,.cmd:focus-visible::before{opacity:1}
.cmd:hover{background:rgba(154,114,38,.08)}
.cmd:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.cmd:disabled{color:var(--dim);cursor:default;opacity:.6}
.cmd:disabled::before{opacity:0}
.cmd small{display:block;font-weight:400;font-size:.8rem;color:var(--dim)}
.cmd.go{color:var(--gold)}

input[type=text],select{
  font:inherit;color:var(--text);background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;min-height:44px;width:100%;
}
input[type=text]:focus-visible,select:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--gold);height:32px}
label{font-size:.85rem;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.val{font-family:var(--f-num);font-size:1.4rem;font-weight:600;color:var(--gold)}

.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rules div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.83rem;min-width:0;color:var(--dim)}
.rules b{display:block;color:var(--text);font-size:.9rem}

.players{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.players li{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.88rem}
.players li.me{border-color:var(--you);color:var(--you)}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:2px 12px;background:rgba(255,255,255,.6)}
.chip.me{border-color:var(--you);color:var(--you);font-weight:700}
.rulewin{border-color:var(--gold)}
.rulewin h2{font-size:1.4rem}

.bignum{font-family:var(--f-num);font-size:4.2rem;line-height:1;text-align:center;font-weight:700;color:var(--you)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{font-family:var(--f-num);font-weight:700;font-size:1rem;color:var(--text);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:6px;min-height:44px;cursor:pointer}
.steps button:focus-visible{outline:2px solid var(--gold)}
.timer{font-family:var(--f-num);font-weight:600;color:var(--gold)}
.status{font-size:.9rem;color:var(--dim)}

.chart{width:100%;height:auto;display:block}
.calc{font-family:var(--f-num);font-size:.84rem;line-height:1.85;display:flex;flex-direction:column;overflow-x:auto}
.calc .k{color:var(--dim);font-family:var(--f-body)}
.hl{color:var(--gold);font-weight:600}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:.75rem;color:var(--dim);font-weight:700}
tr.me td{color:var(--you);font-weight:700}
tr.gap td{text-align:center;color:var(--dim);border-bottom:none}
td .tag{font-size:.72rem;color:var(--dim);margin-left:4px}
.pt{color:var(--good);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px;border-radius:2px}
.note{font-size:.8rem;color:var(--dim)}
@media (prefers-reduced-motion: no-preference){
  .pop{animation:pop .3s ease}
  @keyframes pop{from{transform:translateY(4px);opacity:.5}to{transform:none;opacity:1}}
}

/* --- オンライン版の追加 --- */
.code{font-family:var(--f-num);font-weight:600;font-size:3.2rem;letter-spacing:.25em;text-align:center;color:var(--gold);line-height:1.1;padding-left:.25em}
.code-sm{font-family:var(--f-num);font-weight:600;color:var(--gold);letter-spacing:.12em}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;min-width:0;font-family:var(--f-num);font-size:1.3rem;letter-spacing:.3em;text-align:center}
.btn{font:inherit;font-weight:700;color:#fffaf0;background:linear-gradient(180deg,#c39a4a,var(--gold) 55%,#7c5a1c);border:none;border-radius:6px;padding:0 18px;min-height:44px;cursor:pointer;flex:none}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em}
.check{display:flex;gap:10px;align-items:center;font-size:.95rem;color:var(--text);cursor:pointer;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.offline{font-size:.8rem;color:var(--dim);text-align:center}

/* ---- 使えない数・減点・ボーナス ---- */
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{font-family:var(--f-num);font-weight:600;font-size:.9rem;border-radius:6px;padding:2px 10px;border:1px solid var(--line);text-decoration:line-through;text-decoration-thickness:2px}
.nchip.mine{border-color:var(--you);color:var(--you)}
.nchip.used{color:var(--dim)}
.nchip.top1{border-color:var(--gold);color:var(--gold)}
.legend i.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:2px solid var(--line)}
.legend i.lg.mine{border-color:var(--you)} .legend i.lg.top1{border-color:var(--gold)}
td.neg{color:var(--bad);font-weight:700}
.rulewin.bonus{border-color:var(--you);box-shadow:inset 0 0 0 3px var(--win-a),inset 0 0 0 4px rgba(27,103,132,.35),0 0 18px rgba(27,103,132,.18)}
.timer.danger{color:var(--bad)}
@media (prefers-reduced-motion: no-preference){ .timer.danger{animation:tblink .5s steps(2,start) infinite} @keyframes tblink{50%{opacity:.35}} }
/* ---- これまでのラウンド ---- */
.past .pastitem{display:flex;flex-direction:column;gap:2px;padding-top:6px;border-top:1px solid var(--line)}
.past .pastitem:first-of-type{border-top:none;padding-top:0}
.past .chart{width:auto;max-width:100%;max-height:150px;margin:0 auto}
/* ---- ブービー賞 ---- */
.booby{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:#7a4fb0;border-radius:4px;padding:0 6px;margin-left:6px}
.boobywin{border-color:#7a4fb0}
.boobywin .cap{color:#7a4fb0}
.booby-names{font-family:var(--f-title);font-weight:800;font-size:1.3rem;margin:0}
/* ---- 途中でやめる ---- */
.cmd.abort{font-size:.92rem;color:var(--dim);border:1px dashed var(--line);border-radius:6px;padding-left:12px;text-align:center}
.cmd.abort::before{display:none}
.cmd.abort.armed{color:var(--bad);border-color:var(--bad)}
/* ---- 題字つきの画面 ---- */
.page{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:760px) and (min-height:560px){
  body:has(.page) .wrap{max-width:1240px;height:100%}
  .page{height:100%;min-height:0}
  .page > .logo{flex:0 0 auto;padding-block:0}
  .page > .logo img{width:auto;height:min(25vh,230px)}
  .page > .logo.sm img{height:min(17vh,150px)}
  .page > .cols{height:auto;flex:1 1 auto;min-height:0}
}
/* ---- 画面の組み方：スマホは縦1列、タブレット以上は左右2列でページをスクロールさせない ---- */
.cols,.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:760px) and (min-height:560px){
  html,body{height:100%}
  body:has(.cols){overflow:hidden;padding-block:14px}
  body:has(.cols) .wrap{max-width:1240px;height:100%}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;height:100%;min-height:0;align-items:start}
  .col{overflow-y:auto;max-height:100%;min-height:0;padding-right:4px;scrollbar-width:thin}
  .col > *{flex-shrink:0}
  .col > .win.grow{flex:0 1 auto;min-height:120px;overflow:hidden}
  .col > .win.grow .tbl{overflow-y:auto;min-height:0}
  .logo{padding-block:6px 0}
  .logo h1{font-size:clamp(2.1rem,4.6vw,3rem)}
  .rulewin h2{font-size:1.6rem}
  .bignum{font-size:5rem}
}
</style>

const POINTS = (r,n) => Math.max(0, n-2*(r-1));                 // 上位：1位＝人数、2点刻み

  const s = vals.slice().sort((a,b)=>a-b), n = s.length, sum = s.reduce((a,b)=>a+b,0), h = Math.floor(n/2);

}
const f = x => (Math.round(x*100)/100).toString();
function medianText(st){
  const n=st.n, s=st.sorted;
  return n%2 ? `${(n+1)/2}番目 = ${st.median}` : `${n/2}番目と${n/2+1}番目の平均 = (${s[n/2-1]} + ${s[n/2]}) ÷ 2 = ${f(st.median)}`;
}
function modeText(st){
  if(st.modeCount===1) return `どの数も1回ずつ → 全部が最頻値。その平均 = ${f(st.mode)}`;
  if(st.modes.length===1) return `${st.modes[0]}（${st.modeCount}回）`;
  return `${st.modes.join(', ')}（各${st.modeCount}回）→ 平均 ${f(st.mode)}`;
}
const RULES = [
  {id:'median', name:'中央値に一番近い人', short:'中央値', desc:'全データを小さい順に並べた真ん中。', mode:'near', target:s=>s.median, tf:s=>`目標 = 中央値 = ${f(s.median)}`},
  {id:'mean', name:'平均値に一番近い人', short:'平均値', desc:'全データの合計 ÷ 個数。', mode:'near', target:s=>s.mean, tf:s=>`目標 = 平均値 = ${f(s.mean)}`},
  {id:'twothirds', name:'平均値の 2/3 に一番近い人', short:'平均×2/3', desc:'みんなが読み合うと、どこまで下がる？', mode:'near', target:s=>s.mean*2/3, tf:s=>`目標 = ${f(s.mean)} × 2/3 = ${f(s.mean*2/3)}`},
  {id:'onethird', name:'平均値の 1/3 に一番近い人', short:'平均×1/3', desc:'2/3よりさらに下。でも最初の数字は動かない。', mode:'near', target:s=>s.mean/3, tf:s=>`目標 = ${f(s.mean)} × 1/3 = ${f(s.mean/3)}`},
  {id:'far', name:'平均値から一番遠い人', short:'外れ値', desc:'目立った者勝ち。でも全員が端に行くと…？', mode:'far', target:s=>s.mean, tf:s=>`基準 = 平均値 = ${f(s.mean)}（遠いほど上位）`},
  {id:'q1x2', name:'第1四分位数の 2倍 に一番近い人', short:'Q1×2', desc:'下位半分のデータの中央値を2倍した値。', mode:'near', target:s=>s.q1*2, tf:s=>`目標 = Q1 × 2 = ${f(s.q1)} × 2 = ${f(s.q1*2)}`},
  {id:'modehalf', name:'最頻値の 半分 に一番近い人', short:'最頻値÷2', desc:'一番多く出た数の半分。複数あるときはその平均。', mode:'near', target:s=>s.mode/2, tf:s=>`目標 = 最頻値 ÷ 2 = ${f(s.mode)} ÷ 2 = ${f(s.mode/2)}`},
];
const BONUS = {id:'bonus', name:'ボーナス：だれとも被らなければ、その数がそのまま得点', short:'ボーナス', desc:'最初の数字も含めて、同じ数がほかに1つもなければ成功。', mode:'bonus', target:()=>0, tf:()=>'被らなかった数 ＝ 得点'};
const ruleOf = id => id==='bonus' ? BONUS : (RULES.find(r=>r.id===id) || RULES[0]);
function makeOrder(){
  const o = shuffle(RULES.map(r=>r.id)).slice(0,ROUNDS);
  if(Math.random()<BONUS_P) o[ROUNDS-1]='bonus';   // ボーナスはラウンド5だけ
  return o;
}
/* vals：今回の数（席順）、all：最初の数字＋今回の数の全データ。統計は全データで計算し、順位は今回の数だけでつける */
function judge(vals, all, rule){
  const st = stats(all), n = vals.length;
  if(rule.mode==='bonus'){
    const pts = vals.map(v=> st.cnt[v]===1 ? v : 0);
    const rank = pts.map(p=>1+pts.filter(q=>q>p).length);
    return {st, t:null, d:pts, rank, pts, bonus:true, all};
  }
  const t = rule.target(st);
  const d = vals.map(v=>Math.abs(v-t));
  const better = (a,b)=> rule.mode==='near' ? a<b-1e-9 : a>b+1e-9;
  const rank = d.map(x=>1+d.filter(y=>better(y,x)).length);
  const low  = d.map(x=>1+d.filter(y=>better(x,y)).length);      // 下から何番目
  const pts = rank.map((r,i)=>{ const p=POINTS(r,n); return p>0 ? p : PENALTY(low[i],n); });
  return {st, t, d, rank, pts, all};
}

function winnersOf(vals, r){ const out=[]; vals.forEach((v,i)=>{ if(r.rank[i]===1 && (!r.bonus || r.pts[i]>0) && !out.includes(v)) out.push(v); }); return out; }

const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const TYPES = {

};
const KIRI=[0,10,20,25,30,40,50,60,70,75,80,90,100];
const nearKiri = x => KIRI.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a);
const FAVS=[0,3,7,13,17,21,33,42,50,50,64,77,88,99,100];
/* CPUの性格は5種類が均等になるように配る */
function cpuTypesFor(k){ const keys=Object.keys(TYPES), out=[]; for(let i=0;i<k;i++) out.push(keys[i%keys.length]); return shuffle(out).join(''); }
function pickType(){ let r=Math.random(), acc=0; for(const k in TYPES){ acc+=TYPES[k].w; if(r<acc) return k; } return 'm'; }
/* 使える数の中で、ねらいに一番近い数 */
function nearestAllowed(x, banned){
  x=clamp(x); if(!banned.has(x)) return x;
  for(let d=1; d<=100; d++){ const a=[x-d,x+d].filter(v=>v>=0&&v<=100&&!banned.has(v)); if(a.length) return a[rint(0,a.length-1)]; }
  return x;
}
function randomAllowed(banned){ const a=[]; for(let v=0;v<=100;v++) if(!banned.has(v)) a.push(v); return a.length ? a[rint(0,a.length-1)] : rint(0,100); }
function cpuAnchor(t){
  if(t==='m') return clamp(50+gauss()*15);
  if(t==='g') return rint(0,100);
  if(t==='k') return FAVS[rint(0,FAVS.length-1)];
  if(t==='p') return rint(0,100);
  if(t==='b') return Math.random()<.5 ? rint(0,5) : rint(95,100);     // ギャンブラーは端に置いてデータを揺さぶる
  if(t==='y') return clamp(50+gauss()*20);
  if(t==='i') return FAVS[rint(0,FAVS.length-1)];
  if(t==='z') return KIRI[rint(0,KIRI.length-1)];
  return rint(0,100);   // ガリ勉・天邪鬼・カリスマ
}
function estimate(rule, n2, sampler){
  let sum=0; const K=10;
  for(let k=0;k<K;k++){ const v=[]; for(let i=0;i<n2;i++) v.push(sampler()); sum+=rule.target(stats(v)); }
  return sum/K;
}
/* types：席ごとの性格、bans：席ごとの使えない数（Set）
   ctx：{anc:[席ごとの最初の数字], last:[席ごとの前回の数], prevWin:[前回の1位の数], past:[過去ラウンドに出た数すべて]} */
function cpuPicks(rule, n, types, bans, ctx){
  ctx = ctx || {};
  const uni=()=>rint(0,100), n2=n*2, past=ctx.past||[], prevWin=ctx.prevWin||[];
  let naive=50, l2=50, l3=50, learn=50;
  if(rule.mode!=='bonus'){
    naive = estimate(rule, n2, uni);
    l2 = estimate(rule, n2, ()=> Math.random()<.5 ? uni() : clamp(naive + gauss()*10));
    l3 = estimate(rule, n2, ()=> Math.random()<.5 ? uni() : clamp(l2 + gauss()*6));
    learn = past.length ? estimate(rule, n2, ()=> Math.random()<.5 ? uni() : clamp(past[rint(0,past.length-1)] + gauss()*5)) : naive;
  }
  return types.map((t,j)=>{
    let x;
    const anc = ctx.anc ? ctx.anc[j] : null, last = ctx.last ? ctx.last[j] : null;
    // 新しい性格（どの問題でも同じ考え方で動く）
    if(t==='y'){ x = prevWin.length ? prevWin[rint(0,prevWin.length-1)] + (Math.random()<.5?-1:1)*rint(1,2) : clamp(naive+gauss()*12); return nearestAllowed(x, bans[j]); }
    if(t==='a'){ x = typeof last==='number' ? clamp(100-last+gauss()*5) : uni(); return nearestAllowed(x, bans[j]); }
    if(t==='i'){ x = typeof anc==='number' ? anc + (Math.random()<.5?-1:1)*rint(1,3) : uni(); return nearestAllowed(x, bans[j]); }
    if(t==='z'){
      const want = rule.mode==='bonus' ? KIRI[rint(0,KIRI.length-1)] : rule.mode==='far' ? (Math.random()<.5?0:100) : nearKiri(naive);
      const ok = KIRI.filter(v=>!bans[j].has(v));
      x = ok.length ? ok.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a) : want;
      return nearestAllowed(x, bans[j]);
    }
    if(t==='s'){
      x = rule.mode==='bonus' ? rint(60,99) : rule.mode==='far' ? (learn>=50 ? clamp(Math.abs(gauss())*6) : clamp(100-Math.abs(gauss())*6)) : clamp(learn+gauss()*6);
      return nearestAllowed(x, bans[j]);
    }
    if(t==='c'){
      if(rule.mode==='bonus'){ do{ x=rint(61,99); } while(x%5===0 || FAVS.includes(x)); }
      else if(rule.mode==='far'){ x = naive>=50 ? rint(0,3) : rint(97,100); }
      else x = clamp(l3+gauss()*4);
      return nearestAllowed(x, bans[j]);
    }
    if(rule.mode==='bonus'){
      x = t==='m' ? rint(55,100) : t==='g' ? rint(80,99) : t==='k' ? FAVS[rint(0,FAVS.length-1)] : t==='b' ? rint(90,100) : uni();
    } else if(rule.mode==='far'){
      x = t==='p' ? uni() : t==='k' ? FAVS[rint(0,FAVS.length-1)] : t==='b' ? clamp(50+gauss()*8)
        : (Math.random()<.5 ? clamp(Math.abs(gauss())*12) : clamp(100-Math.abs(gauss())*12));
    } else {
      x = t==='m' ? clamp(naive+gauss()*11) : t==='g' ? clamp(l2+gauss()*8) : t==='k' ? clamp(FAVS[rint(0,FAVS.length-1)]+gauss()*4)
        : t==='p' ? uni() : (Math.random()<.5 ? clamp(100-naive+gauss()*10) : (Math.random()<.5 ? rint(0,8) : rint(92,100)));
    }
    return nearestAllowed(x, bans[j]);
  });
}

/* ================= Firebase 接続 ================= */
function initFirebase(){
  if(!window.firebase){ fbError = 'オンライン機能を読み込めませんでした（通信が制限されている可能性があります）'; return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);

    db.ref('.info/serverTimeOffset').on('value', s=>{ offset = s.val()||0; });
    firebase.auth().onAuthStateChanged(u=>{
      if(u){ uid = u.uid; fbError=''; if(screen==='home') render(); }
    });
    firebase.auth().signInAnonymously().catch(e=>{
      fbError = 'サーバーにログインできませんでした（' + (e.code||'error') + '）';

  }catch(e){ fbError = 'オンライン機能の初期化に失敗しました'; }

/* ================= 部屋 ================= */
async function createRoom(){
  homeErr='';
  for(let tries=0; tries<12; tries++){
    const c = String(rint(1000,9999));
    const ref = db.ref(`${ROOT}/${c}/meta`);
    let res;
    try{
      res = await ref.transaction(cur=>{
        if(cur && cur.host!==uid && cur.createdAt > now()-ROOM_TTL) return;   // 使用中
        return {host:uid, createdAt:firebase.database.ServerValue.TIMESTAMP};
      });
    }catch(e){ homeErr='部屋を作れませんでした（'+(e.code||e.message)+'）'; render(); return; }
    if(res.committed){
      code = c;
      // 前の持ち主のデータを片付ける
      await Promise.all(['players','state','picks'].map(p=>roomRef(p).remove().catch(()=>{})));
      ls.set('crowd-reader-room', code);
      enterRoom(true);
      return;
    }
  }
  homeErr='空いている部屋コードが見つかりませんでした。もう一度試してください'; render();
}
async function joinRoom(c){
  homeErr='';
  if(!/^\d{4}$/.test(c)){ homeErr='4桁の数字を入れてください'; render(); return; }
  let snap;
  try{ snap = await db.ref(`${ROOT}/${c}/meta`).get(); }
  catch(e){ homeErr='接続できませんでした（'+(e.code||e.message)+'）'; render(); return; }
  const m = snap.val();
  if(!m || m.createdAt < now()-ROOM_TTL){ homeErr='その部屋は見つかりません'; render(); return; }
  code = c; ls.set('crowd-reader-room', code);
  enterRoom(m.host===uid);
}
function enterRoom(host){
  isHost = host; solo = false; screen = 'lobby'; G = null; players = {};
  if(!isHost || hostPlays) announce();
  unsub.forEach(u=>u()); unsub = [];
  const listen = (ref, fn)=>{ ref.on('value', fn, ()=>{}); unsub.push(()=>ref.off('value', fn)); };
  listen(roomRef('meta'), s=>{ meta = s.val(); });
  listen(roomRef('players'), s=>{ players = s.val()||{}; if(screen==='lobby') refreshLobby(); });
  listen(roomRef('state'), s=>onState(s.val()));
  const conn = db.ref('.info/connected');
  const onConn = s=>{ if(s.val() && code && (!isHost || hostPlays)) announce(); };
  conn.on('value', onConn); unsub.push(()=>conn.off('value', onConn));
  render();
}
function announce(){
  const ref = roomRef('players/'+uid);
  ref.set({name: nick||'なまえなし', joinedAt: firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});
  ref.onDisconnect().remove();
}
function leaveRoom(){
  if(db && code && uid){
    const ref = roomRef('players/'+uid); ref.onDisconnect().cancel(); ref.remove().catch(()=>{});
  }
  unsub.forEach(u=>u()); unsub=[];
  stopPickWatch();
  code=''; G=null; isHost=false; solo=false; screen='home'; render(); window.scrollTo(0,0);
}

/* ================= 状態の反映 ================= */
function onState(s){
  const prevPhase = G && G.phase, prevRound = G && G.round, prevGid = G && G.gid;
  if(!s || s.phase==='lobby'){
    G = null; stopPickWatch();
    if(screen!=='lobby'){ screen='lobby'; render(); window.scrollTo(0,0); } else refreshLobby();
    return;
  }
  G = s;
  if(G.gid!==prevGid){ myAnchor=null; }
  if(G.gid!==prevGid || G.round!==prevRound || G.phase!==prevPhase){ if(G.phase==='pick'||G.phase==='anchor') myPick = 50; }
  if(G.phase!=='anchor' && myAnchor==null && !solo && myIdx()>=0){
    roomRef(`picks/g${G.gid}a/${uid}`).get().then(x=>{ if(x.exists()){ myAnchor=x.val(); if(G && G.phase==='pick') render(); } }).catch(()=>{});
  }
  if(isHost) syncPickWatch();
  const changed = screen!=='game' || prevPhase!==G.phase || prevRound!==G.round || prevGid!==G.gid;
  screen='game';
  if(changed){
    if((G.phase==='pick'||G.phase==='anchor') && myIdx()>=0 && submittedKey!==roundKey() && !solo) checkMyPick();
    render(); window.scrollTo(0,0);
  } else patchCounts();
}
function checkMyPick(){
  const k = roundKey();
  roomRef(`picks/${k}/${uid}`).get().then(s=>{
    if(s.exists() && roundKey()===k){ submittedKey=k; myPick=s.val(); render(); }
  }).catch(()=>{});
}

/* ================= ホストの進行 ================= */
function commit(next){
  if(solo){ onSoloState(next); return; }
  roomRef('state').set(next).catch(e=>console.error(e));
}
function onSoloState(next){
  const prev = G; G = next; screen='game';
  if(!prev || prev.phase!==G.phase || prev.round!==G.round){ if(G.phase==='pick'||G.phase==='anchor'){ myPick=50; soloPick=null; } render(); window.scrollTo(0,0); }
}
/* ---- 最初の数字（ホストだけが持つ。オンラインでは picks/g{gid}a に保存） ---- */
const ANCH = {gid:null, vals:null};
const anchorKey = () => G ? `g${G.gid}a` : '';
/* 席 i が使えない数：自分の最初の数字・自分が使った数・過去の1位の数 */
function bannedFor(i, ancOfI){
  const b = new Set(arr(G.banned));
  if(typeof ancOfI==='number') b.add(ancOfI);
  arr(G.hist).forEach(row=>{ const v=arr(row)[i]; if(typeof v==='number') b.add(v); });
  return b;
}
let myAnchor = null;     // 自分の最初の数字（自分だけが知っている）
function myBanned(){ const i=myIdx(); return i<0 ? new Set() : bannedFor(i, myAnchor); }

function startGame(){
  let list;
  if(solo) list = [['solo-me', nick||'あなた']];
  else{
    list = Object.entries(players||{}).filter(([k,p])=>p && typeof p.name==='string')
      .sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)).map(([k,p])=>[k, p.name.slice(0,8)]);
    if(!hostPlays) list = list.filter(s=>s[0]!==uid);
    list = list.slice(0, MAX_N);
    if(!list.length) return;
  }
  const n = Math.max(HOST.target, list.length), gid=Date.now();
  HOST.closing = false; ANCH.gid=null; ANCH.vals=null; myAnchor=null;
  if(!solo) roomRef('picks').remove().catch(()=>{});
  commit({gid, phase:'anchor', allHist:[], n, limit: solo?0:HOST.limit, round:0, order:makeOrder(),
    seats:list, cpu:cpuTypesFor(n-list.length), totals:new Array(n).fill(0),
    banned:[], hist:[], allHist:[], picked:0, endsAt: solo?0:now()+HOST.limit*1000});
}
function syncPickWatch(){
  if(!G || (G.phase!=='pick' && G.phase!=='anchor')){ stopPickWatch(); return; }
  const path = `picks/${roundKey()}`;
  if(HOST.pickRef && HOST.pickRef._p===path) return;
  stopPickWatch();
  const ref = roomRef(path); ref._p = path; HOST.pickCount = 0;
  const fn = s=>{
    const v = s.val()||{};
    const c = seats().filter(x=>x[0] in v).length;
    HOST.pickCount = c;
    if(G && (G.phase==='pick'||G.phase==='anchor') && c!==G.picked) roomRef('state/picked').set(c).catch(()=>{});
  };
  ref.on('value', fn, ()=>{}); ref._fn = fn; HOST.pickRef = ref;
}
function stopPickWatch(){ if(HOST.pickRef){ HOST.pickRef.off('value', HOST.pickRef._fn); HOST.pickRef=null; } }
async function hostTick(){
  if(!G || (G.phase!=='pick' && G.phase!=='anchor') || HOST.closing) return;
  if(solo){ if(soloPick!==null){ HOST.closing=true; const p={'solo-me':soloPick}; soloPick=null; G.phase==='anchor' ? closeAnchor(p) : closeRound(p); } return; }
  if(!isHost) return;
  if(HOST.pickCount>=H() || now()>=G.endsAt){
    HOST.closing = true;
    let picks = {};
    try{ picks = (await roomRef(`picks/${roundKey()}`).get()).val()||{}; }catch(e){}
    G.phase==='anchor' ? closeAnchor(picks) : closeRound(picks);
  }
}
/* 最初の数字を確定：未入力の人はランダム、CPUは性格どおり */
function closeAnchor(picks){
  const n=G.n, h=H(), st=seats(), anc=new Array(n);
  st.forEach((s,i)=>{ const v=picks[s[0]]; anc[i] = (typeof v==='number' && v>=0 && v<=100) ? Math.round(v) : rint(0,100); });
  for(let i=h;i<n;i++) anc[i]=cpuAnchor((G.cpu||'')[i-h]||'m');
  ANCH.gid=G.gid; ANCH.vals=anc;
  if(!solo){
    const map={}; anc.forEach((v,i)=>{ map[i<h ? st[i][0] : 'cpu'+i]=v; });
    roomRef(`picks/${anchorKey()}`).set(map).catch(()=>{});
  }
  commit(Object.assign({}, G, {phase:'pick', round:0, picked:0, vals:null, subs:null, endsAt: solo?0:now()+G.limit*1000}));
  setTimeout(()=>{ HOST.closing=false; }, 1200);
}
async function loadAnchors(){
  if(ANCH.gid===G.gid && ANCH.vals) return ANCH.vals;
  const n=G.n, h=H(), st=seats(), anc=new Array(n).fill(50);
  try{
    const m=(await roomRef(`picks/${anchorKey()}`).get()).val()||{};
    for(let i=0;i<n;i++){ const v=m[i<h ? st[i][0] : 'cpu'+i]; if(typeof v==='number') anc[i]=v; }
  }catch(e){}
  ANCH.gid=G.gid; ANCH.vals=anc; return anc;
}
async function closeRound(picks){
  HOST.closing = true;
  const anc = await loadAnchors();
  const rule = ruleOf(arr(G.order)[G.round]), n = G.n, h = H(), st = seats();
  const vals = new Array(n), sub = [], cpuIdx = [], cpuTypes = [], cpuBans = [];
  st.forEach((s,i)=>{
    const v = picks[s[0]], ban = bannedFor(i, anc[i]);
    if(typeof v==='number' && v>=0 && v<=100 && !ban.has(Math.round(v))) vals[i] = Math.round(v);
    else { sub.push(i); vals[i] = randomAllowed(ban); }           // 時間切れは完全ランダム
  });
  for(let i=h;i<n;i++){ cpuIdx.push(i); cpuTypes.push((G.cpu||'')[i-h]||'m'); cpuBans.push(bannedFor(i, anc[i])); }
  const prevRow = arr(arr(G.hist).slice(-1)[0]);
  const cp = cpuPicks(rule, n, cpuTypes, cpuBans, {
    anc: cpuIdx.map(i=>anc[i]), last: cpuIdx.map(i=>prevRow[i]),
    prevWin: arr(G.prevWin), past: [].concat(...arr(G.hist).map(arr))
  });
  cpuIdx.forEach((ix,k)=>vals[ix]=cp[k]);
  const r = judge(vals, vals.concat(anc), rule);
  const tot = totals().slice(); while(tot.length<n) tot.push(0);
  r.pts.forEach((p,k)=>tot[k]=Math.max(0, tot[k]+p));     // 合計はマイナスにならない
  const hist = arr(G.hist).map(arr); hist.push(vals);
  const winNums = winnersOf(vals, r);
  const banned = Array.from(new Set(arr(G.banned).concat(winNums))).sort((a,b)=>a-b);
  commit(Object.assign({}, G, {phase:'result', vals, all:r.all.slice().sort((a,b)=>a-b), subs:sub, totals:tot, hist, allHist: arr(G.allHist).map(arr).concat([r.all.slice().sort((a,b)=>a-b)]), banned, winNums, prevWin:winNums, picked:h-sub.length}));
  setTimeout(()=>{ HOST.closing=false; }, 1500);
}
function nextRound(){
  if(G.round+1>=ROUNDS) commit(Object.assign({}, G, {phase:'final'}));
  else commit(Object.assign({}, G, {phase:'pick', round:G.round+1, vals:null, all:null, subs:null, winNums:null, picked:0, endsAt: solo?0:now()+G.limit*1000}));
}
let abortArmed=0;
function abortHtml(){
  if(!isHost) return '';
  const armed = Date.now()-abortArmed < 4000;
  return `<button class="cmd abort${armed?' armed':''}" id="abortBtn">${armed?'もう一度押すと終了します':(solo?'途中でやめる':'途中でやめてロビーにもどる')}</button>`;
}
function bindAbort(){
  const b=document.getElementById('abortBtn'); if(!b) return;
  b.onclick=()=>{
    if(Date.now()-abortArmed < 4000){ abortArmed=0; HOST.closing=false; backToLobby(); return; }
    abortArmed=Date.now(); render();
    setTimeout(()=>{ if(Date.now()-abortArmed>=4000 && document.getElementById('abortBtn')) render(); }, 4100);
  };
}
function backToLobby(){
  myAnchor=null; ANCH.gid=null; ANCH.vals=null;
  if(solo){ G=null; screen='solo'; render(); window.scrollTo(0,0); return; }
  roomRef('picks').remove().catch(()=>{});
  commit({phase:'lobby'});
}

function chart(all, r, rule, myVal){
  const st=r.st, W=360, L=24, R=344, X=v=>L+(R-L)*v/100;
  const bins=new Array(20).fill(0); all.forEach(v=>bins[Math.min(19,Math.floor(v/5))]++);
  const maxC=Math.max(...bins), hTop=16, hBase=120, sc=(hBase-hTop-14)/maxC, bw=(R-L)/20;
  const bars=bins.map((c,i)=>c?`<rect x="${L+i*bw+1}" y="${hBase-c*sc}" width="${bw-2}" height="${c*sc}" fill="var(--bar)"/>`:'').join('');
  const yTicks=[0,Math.ceil(maxC/2),maxC].filter((v,i,a)=>a.indexOf(v)===i).map(c=>`<text x="${L-4}" y="${hBase-c*sc+3}" text-anchor="end" font-size="9" fill="var(--dim)" font-family="IBM Plex Mono,monospace">${c}</text>`).join('');
  const xTicks=[0,25,50,75,100].map(t=>`<line x1="${X(t)}" x2="${X(t)}" y1="${hBase}" y2="${hBase+4}" stroke="var(--dim)"/><text x="${X(t)}" y="${hBase+15}" text-anchor="middle" font-size="10" fill="var(--dim)" font-family="IBM Plex Mono,monospace">${t}</text>`).join('');
  const by=152;
  const box=`<line x1="${X(st.min)}" x2="${X(st.q1)}" y1="${by}" y2="${by}" stroke="var(--text)"/>
    <line x1="${X(st.q3)}" x2="${X(st.max)}" y1="${by}" y2="${by}" stroke="var(--text)"/>
    <line x1="${X(st.min)}" x2="${X(st.min)}" y1="${by-6}" y2="${by+6}" stroke="var(--text)"/>
    <line x1="${X(st.max)}" x2="${X(st.max)}" y1="${by-6}" y2="${by+6}" stroke="var(--text)"/>
    <rect x="${X(st.q1)}" y="${by-10}" width="${Math.max(1,X(st.q3)-X(st.q1))}" height="20" fill="var(--win-b)" stroke="var(--text)"/>
    <line x1="${X(st.median)}" x2="${X(st.median)}" y1="${by-10}" y2="${by+10}" stroke="var(--text)" stroke-width="2"/>
    <text x="${X(st.mean)}" y="${by+4}" text-anchor="middle" font-size="11" fill="var(--text)">+</text>`;
  let target='';
  if(r.t!=null){
    const tx=X(r.t);
    target=`<rect x="${tx-1.5}" y="${hTop-2}" width="3" height="${by+12-hTop}" fill="var(--gold)"/>
    <text x="${Math.min(Math.max(tx,40),320)}" y="${hTop-5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--gold)">${rule.mode==='far'?'基準':'目標'} ${f(r.t)}</text>`;
  }
  let you='';
  if(myVal!=null){
    const b=Math.min(19,Math.floor(myVal/5)), yx=X(myVal);
    you=`<path d="M${yx-5} ${hBase+29} L${yx+5} ${hBase+29} L${yx} ${hBase+22} Z" fill="var(--you)"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} 174" role="img" aria-label="全データのヒストグラムと箱ひげ図">
    <line x1="${L}" x2="${R}" y1="${hBase}" y2="${hBase}" stroke="var(--text)"/>${bars}${you}${yTicks}${xTicks}${box}${target}</svg>`;
}

  </section>
  ${hostControls(last?'最終結果へ':'次のラウンドへ')}
  ${last?'':abortHtml()}</div></div>`;
  bindAbort();
  const nb=document.getElementById('nextBtn'); if(nb) nb.onclick=()=>{ nb.disabled=true; nextRound(); };
}
function renderFinal(){
  const mi=myIdx(), tot=totals();
  const order=tot.map((t,i)=>i).sort((a,b)=>tot[b]-tot[a] || a-b);
  // ブービー賞：ビリ（最低点）の次に低い点の人
  const lows=Array.from(new Set(tot)).sort((a,b)=>a-b);
  const boobyScore = lows.length>=2 ? lows[1] : null;
  const booby = boobyScore==null ? [] : tot.map((t,i)=>i).filter(i=>tot[i]===boobyScore);
  const cell=i=>`<tr class="${i===mi?'me':''}"><td class="num">${rankOf(i)}位</td><td>${esc(seatName(i))}${i>=H()?`<span class="tag">${seatTag(i)}</span>`:''}${booby.includes(i)?'<span class="booby">ブービー賞</span>':''}</td><td class="num">${tot[i]}点</td></tr>`;
  const humans = seats().map((s,i)=>i).sort((a,b)=>tot[b]-tot[a] || a-b);
  app.innerHTML = `<div class="cols"><div class="col">
  <header class="logo"><span class="sub">FINAL RESULT</span>
    <p class="big-title">${mi<0?'ゲーム終了':rankOf(mi)===1?'VICTORY':`${rankOf(mi)}位`}</p>
    <div class="rule"></div>
    ${mi>=0?`<span class="ja">${tot[mi]}点 / 最大 ${G.n*ROUNDS}点 ・ ${G.n}人中</span>`:''}</header>
  ${booby.length?`<section class="win boobywin">
    <span class="cap">BOOBY PRIZE ・ ブービー賞（ビリから2番目）</span>
    <p class="booby-names">${booby.map(i=>`${esc(seatName(i))}${i===mi?'（あなた）':''}`).join('、')}</p>
    <p class="note">${boobyScore}点 ・ ${rankOf(booby[0])}位 / ${G.n}人</p>
  </section>`:''}
  <section class="win">
    <span class="cap">STANDINGS ・ CPU込み</span>
    <div class="tbl"><table><thead><tr><th>順位</th><th>プレイヤー</th><th>合計</th></tr></thead>
    <tbody>${rowsHtml(order, cell, mi, 10, 3)}</tbody></table></div>
  </section></div><div class="col">${!solo && H()>1 ? `<section class="win grow">
    <span class="cap">PLAYERS ・ 人間だけ</span>
    <div class="tbl"><table><thead><tr><th>順位</th><th>プレイヤー</th><th>合計</th></tr></thead>
    <tbody>${humans.map(cell).join('')}</tbody></table></div>
  </section>`:''}
  ${isHost ? `<section class="win menu">
      <button class="cmd go" id="againBtn">${solo?'もう一度遊ぶ':'ロビーにもどる'}</button>
      <button class="cmd" id="homeBtn">タイトルへ</button></section>`
    : `<section class="win menu"><p class="status" style="padding:4px 8px">ホストが次のゲームを準備するとロビーにもどります</p><button class="cmd" id="homeBtn">部屋を出る</button></section>`}</div></div>`;
  const ag=document.getElementById('againBtn');
  if(ag) ag.onclick = ()=>{ if(solo) startGame(); else backToLobby(); };
  document.getElementById('homeBtn').onclick = ()=>{ if(solo){ G=null; solo=false; isHost=false; screen='home'; render(); } else leaveRoom(); };
}

/* ================= 起動 ================= */
setInterval(()=>{ updateTimer(); hostTick(); }, 300);
initFirebase();
render();
})();

</script>
</body>
</html>
